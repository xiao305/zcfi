<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | zcfi.cn</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico">
    
    <link rel="stylesheet" href="assets/css/icons.css">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .blog-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #eaeaea;
        }
        
        .loading-message {
            text-align: center;
            color: #777;
            padding: 40px;
            font-style: italic;
        }
        
        .error-message {
            text-align: center;
            color: #e74c3c;
            padding: 40px;
            background: #fdf2f2;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
    <link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/page-state.css?v=20261107b"><script>document.documentElement.classList.add('page-state-checking');window.__pageStateReady=false;setTimeout(function(){if(!window.__pageStateReady)document.documentElement.classList.remove('page-state-checking');},6000);</script>

</head>
<body>
    <!-- 头部导航 -->
    <div id="navbar-container"></div>

    <main style="margin-top: 100px;">
    <h1 class="visually-hidden">博客 | zcfi.cn</h1>
        <section style="padding: 80px 0;">
            <div class="container">
                <div class="section-title">
                    <h2>最新博客</h2>
                    <p>分享我的思考、学习心得和技术文章</p>
                </div>
                <div class="blog-toolbar" role="search">
                    <label class="blog-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="search" id="blogSearch" placeholder="搜索标题、摘要、标签…" aria-label="搜索博客文章">
                    </label>
                    <select id="blogTag" aria-label="按标签筛选">
                        <option value="">全部标签</option>
                    </select>
                    <select id="blogSort" aria-label="排序方式">
                        <option value="newest">最新优先</option>
                        <option value="oldest">最早优先</option>
                        <option value="title">标题排序</option>
                    </select>
                    <button type="button" class="blog-clear" id="blogClear">重置</button>
                    <span class="blog-count" id="blogCount"></span>
                </div>
                <div id="blog-container" class="blog-grid">
                    <div class="loading-message">加载博客中...</div>
                </div>
                <div class="blog-loadmore-wrap" id="blogMoreWrap" hidden>
                    <button type="button" class="blog-loadmore" id="blogMore">
                        <i class="fas fa-chevron-down" aria-hidden="true"></i> 加载更多
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <div id="footer-container"></div>

    <script src="assets/js/site-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var container = document.getElementById('blog-container');
            var searchInput = document.getElementById('blogSearch');
            var tagSelect = document.getElementById('blogTag');
            var sortSelect = document.getElementById('blogSort');
            var clearBtn = document.getElementById('blogClear');
            var countEl = document.getElementById('blogCount');
            var moreWrap = document.getElementById('blogMoreWrap');
            var moreBtn = document.getElementById('blogMore');
            var esc = window.SiteData.escapeHtml;

            var PAGE_SIZE = 9;
            var state = { posts: [], q: '', tag: '', sort: 'newest', limit: PAGE_SIZE };

            function stripHtml(html) {
                var div = document.createElement('div');
                div.innerHTML = html || '';
                return div.textContent || '';
            }

            function readParams() {
                var params = new URLSearchParams(window.location.search);
                state.q = params.get('q') || '';
                state.tag = params.get('tag') || '';
                state.sort = params.get('sort') || 'newest';
                if (['newest', 'oldest', 'title'].indexOf(state.sort) === -1) state.sort = 'newest';
                if (searchInput) searchInput.value = state.q;
            }

            function writeParams() {
                var params = new URLSearchParams();
                if (state.q) params.set('q', state.q);
                if (state.tag) params.set('tag', state.tag);
                if (state.sort !== 'newest') params.set('sort', state.sort);
                var qs = params.toString();
                var url = window.location.pathname + (qs ? '?' + qs : '');
                window.history.replaceState(null, '', url);
            }

            function postHref(post) {
                if (post.customUrl && /^https?:\/\//i.test(post.customUrl)) return post.customUrl;
                if (post.customUrl && /^[a-z0-9._-]+\.html$/i.test(post.customUrl)) return 'blogs/' + post.customUrl;
                return 'blogs/' + encodeURIComponent(post.id || '') + '.html';
            }

            function filtered() {
                var q = state.q.trim().toLowerCase();
                var list = state.posts.filter(function (post) {
                    if (state.tag && (post.tags || []).map(String).map(function (t) { return t.toLowerCase(); }).indexOf(state.tag.toLowerCase()) === -1) return false;
                    if (!q) return true;
                    var hay = [post.title, post.excerpt, stripHtml(post.content), (post.tags || []).join(' '), post.date].join(' ').toLowerCase();
                    return hay.indexOf(q) !== -1;
                });
                if (state.sort === 'newest') {
                    list.sort(function (a, b) { return window.SiteData.postTimestamp(b) - window.SiteData.postTimestamp(a); });
                } else if (state.sort === 'oldest') {
                    list.sort(function (a, b) { return window.SiteData.postTimestamp(a) - window.SiteData.postTimestamp(b); });
                } else if (state.sort === 'title') {
                    list.sort(function (a, b) { return String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN'); });
                }
                return list;
            }

            function render() {
                var list = filtered();
                var shown = list.slice(0, state.limit);
                if (countEl) countEl.textContent = list.length ? ('共 ' + list.length + ' 篇') : '';
                if (moreWrap) moreWrap.hidden = list.length <= state.limit;

                if (!list.length) {
                    container.innerHTML = '<div class="blog-empty">没有找到匹配的文章' +
                        (state.q || state.tag ? '<div class="blog-empty-tags">试试更换关键词或点击“重置”</div>' : '') + '</div>';
                    return;
                }

                container.innerHTML = shown.map(function (post) {
                    var tags = (post.tags || []).slice(0, 4).map(function (tag) {
                        return '<span class="tech-tag">' + esc(tag) + '</span>';
                    }).join('');
                    return '<div class="blog-card">' +
                        '<div class="blog-date">' + esc(post.date || post.lastUpdated || '近期') + '</div>' +
                        '<div class="blog-content">' +
                            '<h3><a href="' + esc(postHref(post)) + '" style="color:inherit;text-decoration:none;">' + esc(post.title || '未命名文章') + '</a></h3>' +
                            '<p>' + esc(post.excerpt || stripHtml(post.content).slice(0, 90) || '文章摘要') + '</p>' +
                            (tags ? '<div class="tech-stack" style="margin-bottom:12px;">' + tags + '</div>' : '') +
                            '<a href="' + esc(postHref(post)) + '" class="read-more">阅读更多 →</a>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }

            function bind() {
                if (searchInput) searchInput.addEventListener('input', function () {
                    state.q = searchInput.value;
                    state.limit = PAGE_SIZE;
                    writeParams();
                    render();
                });
                if (tagSelect) tagSelect.addEventListener('change', function () {
                    state.tag = tagSelect.value;
                    state.limit = PAGE_SIZE;
                    writeParams();
                    render();
                });
                if (sortSelect) sortSelect.addEventListener('change', function () {
                    state.sort = sortSelect.value;
                    state.limit = PAGE_SIZE;
                    writeParams();
                    render();
                });
                if (clearBtn) clearBtn.addEventListener('click', function () {
                    state.q = '';
                    state.tag = '';
                    state.sort = 'newest';
                    state.limit = PAGE_SIZE;
                    if (searchInput) searchInput.value = '';
                    if (tagSelect) tagSelect.value = '';
                    if (sortSelect) sortSelect.value = 'newest';
                    writeParams();
                    render();
                });
                if (moreBtn) moreBtn.addEventListener('click', function () {
                    state.limit += PAGE_SIZE;
                    render();
                });
            }

            readParams();
            bind();

            window.SiteData.load().then(function (data) {
                state.posts = window.SiteData.publishedPosts(data.blog);
                var tags = [];
                state.posts.forEach(function (post) {
                    (post.tags || []).forEach(function (tag) {
                        if (tags.indexOf(tag) === -1) tags.push(tag);
                    });
                });
                tags.sort(function (a, b) { return String(a).localeCompare(String(b), 'zh-CN'); });
                if (state.tag && tags.indexOf(state.tag) === -1) {
                    // URL 里的标签已不存在（例如文章被删除），自动清掉避免空白筛选
                    state.tag = '';
                    writeParams();
                }
                if (tagSelect) {
                    tags.forEach(function (tag) {
                        var opt = document.createElement('option');
                        opt.value = tag;
                        opt.textContent = tag;
                        tagSelect.appendChild(opt);
                    });
                    if (state.tag) tagSelect.value = state.tag;
                }
                if (sortSelect) sortSelect.value = state.sort;
                render();
            }).catch(function () {
                container.innerHTML = '<div class="error-message"><p>❌ 博客加载失败</p><p>请检查网络连接，或稍后重试。</p></div>';
            });
        });
    </script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/analytics.js"></script>
<script src="assets/js/page-state.js?v=20261107a" defer></script>

<script src="assets/js/gist-renderer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    if (!window.gistRenderer) return;
    try {
        await window.gistRenderer.loadConfig();
        await window.gistRenderer.renderAll();
    } catch (e) {
        console.warn('动态页眉/页脚加载失败', e);
    }
});
</script>
</body>
</html>
