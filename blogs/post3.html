<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘的内容 | zcfi.cn</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; 
            background: #f5f5f5; 
            color: #333; 
            line-height: 1.6;
        }
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px;
        }
        .article-card { 
            background: white; 
            padding: 50px; 
            border-radius: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .article-title { 
            font-size: 2.2rem; 
            color: #333; 
            margin-bottom: 20px; 
            line-height: 1.3;
            text-align: center;
        }
        .article-meta { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            color: #666; 
            font-size: 0.95rem;
            margin-bottom: 30px; 
            padding-bottom: 25px; 
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }
        .article-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            color: #333;
            font-weight: 500;
        }
        .article-content { 
            line-height: 1.8; 
            font-size: 1.1rem; 
            color: #333;
        }
        .article-content p { 
            margin-bottom: 25px; 
            text-align: justify;
        }
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
        }
        .article-tag {
            background: #f0f0f0;
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .article-tag:hover {
            background: #4a6fa5;
            color: white;
        }
        .article-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }
        .back-to-blog {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: #4a6fa5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-to-blog:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .article-card { padding: 30px; }
            .article-title { font-size: 1.8rem; }
            .article-meta { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="article-card">
            <h1 class="article-title">神秘的内容</h1>
            
            <div class="article-meta">
                <div class="article-meta-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>发布时间: 2026年8月31日</span>
                </div>
                <div class="article-meta-item">
                    <i class="fas fa-history"></i>
                    <span>最后更新: 2026-08-30</span>
                </div>
                
                <div class="article-meta-item">
                    <i class="fas fa-user"></i>
                    <span>作者: 阳光保安</span>
                </div>
                
                <div class="article-meta-item">
                    <i class="fas fa-toggle-on{{else}}off"></i>
                    <span>状态: published</span>
                </div>
            </div>
            
            
            <div class="article-tags">
                
            </div>
            
            
            <div class="article-content">
                {一串八位数，数字里没有6，包含数字0和8；
前四位数字都大于等于5，后四位里藏着0；
全部数字互不重复，整体由7、2、9、5、1、0、4、8组成}
            </div>
            
            <div class="article-actions">
                <a href="../blog.html" class="back-to-blog">
                    <i class="fas fa-arrow-left"></i> 返回博客列表
                </a>
                <a href="#top" class="back-to-blog" style="background: #6c757d;">
                    <i class="fas fa-arrow-up"></i> 返回顶部
                </a>
            </div>
        </div>
    </div>
</body>
</html>
