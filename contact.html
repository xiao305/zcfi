<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 | zcfi.cn</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="./favicon/site.webmanifest">
    
    <!-- Web App Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="./favicon/web-app-manifest-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./favicon/web-app-manifest-512x512.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .modal-icon.success {
            color: #28a745;
        }
        
        .modal-icon.error {
            color: #dc3545;
        }
        
        .modal-icon.loading {
            color: #4a6fa5;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .modal-icon.loading i {
            animation: spin 1s linear infinite;
        }
        
        .modal-icon.info {
            color: #4a6fa5;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-message {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            min-width: 150px;
        }
        
        .modal-btn-primary {
            background: #4a6fa5;
            color: white;
        }
        
        .modal-btn-primary:hover {
            background: #3a5a80;
            transform: translateY(-2px);
        }
        
        .modal-btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .modal-btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        
        .modal-btn-close {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }
        
        .modal-btn-close:hover {
            background: #e9ecef;
        }
        
        /* 邮箱快捷链接样式 */
        .email-link {
            padding: 8px 16px;
            background: #4a6fa5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-block;
        }
        
        .email-link:hover {
            background: #3a5a80;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- 头部导航容器 -->
    <div id="navbar-container"></div>

    <main style="margin-top: 100px;">
        <section style="background-color: #f9fafc; padding: 80px 0;">
            <div class="container">
                <div class="section-title">
                    <h2>联系我</h2>
                    <p>欢迎与我交流合作，我会尽快回复您的消息</p>
                </div>
                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">姓名</label>
                            <input type="text" id="name" class="form-control" placeholder="请输入您的姓名" required>
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" id="email" class="form-control" placeholder="请输入您的邮箱" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">主题</label>
                            <input type="text" id="subject" class="form-control" placeholder="请输入邮件主题" required>
                        </div>
                        <div class="form-group">
                            <label for="message">留言内容</label>
                            <textarea id="message" class="form-control" placeholder="请输入您的留言内容" required></textarea>
                        </div>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <button type="submit" class="submit-btn" style="flex: 1; min-width: 200px;">发送消息</button>
                            <button type="button" id="emailBtn" class="cta-button" style="background: #4a6fa5; flex: 1; min-width: 200px;">通过邮箱发送</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- 弹窗容器 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div id="modalIcon" class="modal-icon"></div>
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalMessage" class="modal-message"></p>
            <div id="modalButtons" class="modal-buttons"></div>
        </div>
    </div>

    <!-- 页脚容器 -->
    <div id="footer-container"></div>

    <!-- Gist渲染器 -->
    <script src="assets/js/gist-renderer.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('联系页面开始加载...');
            
            // 确保GistRenderer已加载
            if (!window.gistRenderer) {
                console.error('gist-renderer.js未正确加载');
                return;
            }
            
            try {
                // 加载网站配置并更新页面标题
                const configData = await window.gistRenderer.loadConfig();
                
                if (configData.site && configData.site.name) {
                    document.title = `联系我 | ${configData.site.name}`;
                }
                
                // 渲染导航栏和页脚
                await window.gistRenderer.renderAll();
                
            } catch (error) {
                console.error('初始化失败:', error);
            }
        });
        
        // 弹窗控制函数
        function showModal(type, title, message, buttons = []) {
            const overlay = document.getElementById('modalOverlay');
            const icon = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');
            const buttonsEl = document.getElementById('modalButtons');
            
            // 设置图标
            icon.className = 'modal-icon ' + type;
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            } else if (type === 'loading') {
                icon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            } else if (type === 'info') {
                icon.innerHTML = '<i class="fas fa-info-circle"></i>';
                icon.style.color = '#4a6fa5';
            }
            
            // 设置标题和消息
            titleEl.textContent = title;
            messageEl.textContent = message;
            
            // 设置按钮
            buttonsEl.innerHTML = '';
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = `modal-btn ${btn.class || 'modal-btn-primary'}`;
                button.textContent = btn.text;
                button.onclick = btn.onClick;
                buttonsEl.appendChild(button);
            });
            
            // 显示弹窗
            overlay.classList.add('active');
        }
        
        function hideModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
        }
        
        // 生成邮件链接的辅助函数
        function generateMailtoLink(name, email, subject, message) {
            const timestamp = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // 使用 %0D%0A (CRLF) 确保跨平台换行兼容
            const CRLF = '%0D%0A';
            const SEPARATOR = `━━━━━━━━━━━━━━━━━━━━`;
            
            let body = `【来源】zcfi.cn 网站自动填写${CRLF}`;
            body += `【时间】${timestamp}${CRLF}${CRLF}`;
            body += `${SEPARATOR}${CRLF}${CRLF}`;
            body += `姓名：${name}${CRLF}`;
            if (email) body += `邮箱：${email}${CRLF}`;
            body += `${CRLF}${SEPARATOR}${CRLF}${CRLF}`;
            body += `主题：${subject}${CRLF}${CRLF}`;
            body += `留言内容：${CRLF}${message}`;
            
            return `mailto:zcfi.cn@outlook.com?subject=${encodeURIComponent(`[网站留言] ${subject}`)}&body=${body}`;
        }
        
        // 邮箱跳转功能 - 显示选择弹窗
        function showEmailOptions(name, email, subject, message) {
            const modalMessage = document.getElementById('modalMessage');
            
            showModal('info', '选择发送方式', '', [
                { 
                    text: '通过邮件客户端发送', 
                    class: 'modal-btn-primary', 
                    onClick: () => {
                        const mailtoUrl = generateMailtoLink(name, email, subject, message);
                        window.location.href = mailtoUrl;
                        hideModal();
                    }
                },
                { 
                    text: '通过网页版邮箱发送', 
                    class: 'modal-btn-secondary', 
                    onClick: () => {
                        copyEmailContent(name, email, subject, message);
                    }
                },
                { 
                    text: '取消', 
                    class: 'modal-btn-close', 
                    onClick: () => hideModal() 
                }
            ]);
            
            // 自定义消息内容，添加说明文字
            modalMessage.innerHTML = `
                <p style="margin-bottom: 15px;">请选择您喜欢的邮件发送方式：</p>
                <div style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; font-size: 13px; color: #666;">
                    <p style="margin-bottom: 8px;"><strong>通过邮件客户端发送：</strong>自动调用系统默认邮件软件（如 Outlook、Apple Mail），自动填写所有内容</p>
                    <p style="margin: 0;"><strong>通过网页版邮箱发送：</strong>复制格式化内容到剪贴板，手动粘贴到 QQ邮箱、163邮箱等网页邮箱</p>
                </div>
            `;
        }
        
        document.getElementById('emailBtn').addEventListener('click', function() {
            const name = document.getElementById('name').value || '访客';
            const email = document.getElementById('email').value || '';
            const subject = document.getElementById('subject').value || '网站咨询';
            const message = document.getElementById('message').value || '';
            
            showEmailOptions(name, email, subject, message);
        });
        
        // 复制邮件内容到剪贴板
        function copyEmailContent(name, email, subject, message) {
            const timestamp = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const SEPARATOR = '━━━━━━━━━━━━━━━━━━━━';
            let content = `【来源】zcfi.cn 网站自动填写\n`;
            content += `【时间】${timestamp}\n\n`;
            content += `${SEPARATOR}\n\n`;
            content += `姓名：${name}\n`;
            if (email) content += `邮箱：${email}\n`;
            content += `\n${SEPARATOR}\n\n`;
            content += `主题：${subject}\n\n`;
            content += `留言内容：\n${message}`;
            
            navigator.clipboard.writeText(content).then(() => {
                hideModal();
                
                const modalMessage = document.getElementById('modalMessage');
                showModal('success', '复制成功', '', [
                    { text: '确定', class: 'modal-btn-primary', onClick: () => hideModal() }
                ]);
                
                modalMessage.innerHTML = `
                    <p style="margin-bottom: 15px;">邮件内容已复制到剪贴板！</p>
                    <div style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin-bottom: 10px;">请打开您的邮箱，新建邮件并粘贴内容</p>
                        <p style="margin: 0;">收件人填写：<strong style="color: #4a6fa5; font-size: 15px;">zcfi.cn@outlook.com</strong></p>
                    </div>
                    <p style="margin-bottom: 10px; color: #666; font-size: 13px;">快捷跳转：</p>
                    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                        <a href="https://mail.qq.com" target="_blank" class="email-link">QQ邮箱</a>
                        <a href="https://mail.163.com" target="_blank" class="email-link">网易邮箱</a>
                        <a href="https://mail.google.com" target="_blank" class="email-link">Gmail</a>
                    </div>
                `;
            }).catch(err => {
                hideModal();
                showModal('error', '复制失败', '自动复制失败，请手动复制以下内容：\n\n' + content, [
                    { text: '确定', class: 'modal-btn-primary', onClick: () => hideModal() }
                ]);
            });
        }

        // 表单提交：通过 Cloudflare Worker 存入 Gist
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // 获取表单字段
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !subject || !message) {
                showModal('error', '提示', '请完整填写所有字段', [
                    { text: '确定', class: 'modal-btn-primary', onClick: () => hideModal() }
                ]);
                return;
            }

            // 构建要存入的内容（将邮箱和主题合并到 content 中）
            const content = `【主题】${subject}\n【邮箱】${email}\n【留言】${message}`;

            // 显示加载状态弹窗
            showModal('loading', '发送中', '正在发送您的消息，请稍候...', []);

            try {
                // 发送 POST 请求到 Cloudflare Worker
                const workerUrl = 'https://your-worker.your-subdomain.workers.dev'; // ← 需要替换成您的Worker地址
                
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, content })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || '提交失败');
                }

                // 成功弹窗
                showModal('success', '发送成功', '留言发送成功！我会尽快回复您。', [
                    { text: '关闭', class: 'modal-btn-primary', onClick: () => {
                        hideModal();
                        document.getElementById('contactForm').reset();
                    }}
                ]);
            } catch (error) {
                console.error(error);
                
                // 失败弹窗，提供通过邮件发送的选项
                const modalMessage = document.getElementById('modalMessage');
                showModal('error', '发送失败', '', [
                    { 
                        text: '通过邮箱发送', 
                        class: 'modal-btn-primary', 
                        onClick: () => {
                            showEmailOptions(name, email, subject, message);
                        }
                    },
                    { 
                        text: '取消', 
                        class: 'modal-btn-close', 
                        onClick: () => hideModal() 
                    }
                ]);
                
                modalMessage.innerHTML = `
                    <p style="margin-bottom: 10px;">消息发送失败。</p>
                    <p style="margin: 0; color: #666;">您可以点击下方的"通过邮箱发送"按钮，选择使用邮件客户端或网页版邮箱发送。</p>
                `;
            }
        });
    </script>
</body>
</html>
