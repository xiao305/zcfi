    <!-- 作品集特定样式 -->
    <style>
        .portfolio-section {
            padding: 80px 0;
            background-color: #f9fafc;
        }
        
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .portfolio-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .portfolio-item:hover {
            transform: translateY(-5px);
        }
        
        .portfolio-img {
            height: 180px;
            background: linear-gradient(135deg, #4a6fa5 0%, #3a5a80 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .portfolio-img i {
            font-size: 48px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .portfolio-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .portfolio-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .portfolio-content h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .portfolio-content p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        
        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .tech-tag {
            background: #f0f5ff;
            color: #4a6fa5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .project-links {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }
        
        .project-link {
            color: #4a6fa5;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s ease;
        }
        
        .project-link:hover {
            color: #3a5a80;
        }
        
        .loading-message {
            text-align: center;
            color: #777;
            padding: 60px 20px;
            font-style: italic;
            font-size: 18px;
        }
        
        .error-message {
            text-align: center;
            color: #e74c3c;
            padding: 40px;
            background: #fdf2f2;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .empty-state {
            text-align: center;
            color: #777;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #dee2e6;
        }
    </style>
    <link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/page-state.css">
</head>
<body>

    <header>
        <div class="container">

                <a href="../index.html" class="logo">zcfi<span>.</span>cn</a>

                    <li><a href="../index.html">首页</a></li>
                    <li><a href="../portfolio.html" class="active">作品集</a></li>
                    <li><a href="../blog.html">博客</a></li>
                    <li><a href="../contact.html">联系我</a></li>
                </ul>
                <button type="button" class="nav-search-btn" data-site-search-open aria-label="站内搜索" title="站内搜索">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
                <button type="button" class="mobile-menu-btn" aria-label="打开导航菜单" aria-expanded="false" aria-controls="primary-nav">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </nav>
        </div>
    </header>

    <main style="margin-top: 100px;">
    <h1 class="visually-hidden">作品集 | zcfi.cn</h1>
        <section class="portfolio-section">
            <div class="container">
                <div class="section-title">
                    <h2>作品展示</h2>
                    <p>我的网页设计、开发项目和其他创作</p>
                </div>
                
                <div class="portfolio-toolbar">
                    <select id="portfolioTech" aria-label="按技术栈筛选">
                        <option value="">全部技术栈</option>
                    </select>
                    <select id="portfolioSort" aria-label="排序方式">
                        <option value="default">默认排序</option>
                        <option value="updated">最近更新</option>
                        <option value="title">名称排序</option>
                        <option value="featured">首页展示优先</option>
                    </select>
                    <span class="portfolio-count" id="portfolioCount"></span>
                </div>

                <div id="portfolio-container">
                    <div class="loading-message">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>正在加载作品集...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
