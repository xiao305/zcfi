<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>包裹打包预览 • zcfi</title>

  <!-- Favicon（绝对路径，与首页一致） -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon/web-app-manifest-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon/web-app-manifest-512x512.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">

  <style>
    :root{
      --primary:#4a6fa5;
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --radius:12px;
      --gap:16px;
    }
    html,body{height:100%;margin:0;font-family:"Noto Sans SC","Poppins",system-ui,Arial;background:var(--bg);color:#111}
    .site-header{
      background:linear-gradient(90deg,#fff 0%, #f3f7fb 100%);
      border-bottom:1px solid rgba(15,23,42,0.04);
      padding:14px 18px;display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:100;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary)}
    .brand img{width:40px;height:40px;border-radius:8px}
    .brand .sitename{font-size:14px;line-height:1}
    .brand .sitename small{display:block;color:var(--muted);font-size:12px}
    .container{max-width:1100px;margin:18px auto;padding:0 16px;padding-top:70px}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:var(--gap);align-items:start}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title-row h2{margin:0;font-size:16px;color:#111}
    .muted{color:var(--muted);font-size:13px}
    .video-box{background:#000;border-radius:10px;overflow:hidden;height:460px;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
    .thumb{border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #eef2f7;background:#f8fafc;height:96px;display:flex;align-items:center;justify-content:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .btn{background:var(--primary);color:white;border:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:background 0.2s}
    .btn:hover{background:#3a5a80}
    .no-media{padding:28px;text-align:center;color:var(--muted);display:block;}

    /* 居中弹窗 */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(3,7,18,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;
      animation:fadeIn 0.2s ease;
    }
    .modal-overlay.show{display:flex}
    .modal{
      background:var(--card);border-radius:12px;padding:24px;max-width:420px;width:100%;
      box-shadow:0 30px 60px rgba(2,6,23,0.4);
      animation:slideUp 0.25s ease;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

    .modal h3{margin:0 0 10px 0;font-size:18px;color:#222}
    .modal p{margin:0 0 16px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .modal .row{display:flex;gap:8px;align-items:center}
    .modal .code-input{flex:1}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .modal .btn-cancel{background:#9aa8bf}
    .modal .btn-cancel:hover{background:#7e8ba0}

    /* lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(3,7,18,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
    .lightbox.show{display:flex}
    .lightbox img{max-width:95%;max-height:95%;border-radius:8px}
    .lb-close{position:fixed;right:18px;top:18px;color:white;background:rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;cursor:pointer}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:white;font-size:32px;padding:8px 10px;cursor:pointer;user-select:none}
    .lb-prev{left:18px}
    .lb-next{right:18px}

    @media (max-width:1000px){ .layout{grid-template-columns:1fr} .video-box{height:280px} }
    @media (max-width:420px){ .video-box{height:220px} }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="/index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary)">
        <img src="/favicon/web-app-manifest-192x192.png" alt="zcfi logo" />
        <div class="sitename">zcfi<span style="color:var(--muted);font-weight:600">.</span><span style="color:var(--muted)">cn</span></div>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <section class="card">
        <div class="title-row">
          <h2 id="codeTitle">编码：—</h2>
        </div>

        <div id="videoArea" style="margin-top:12px">
          <div class="video-box" id="videoBox">
            <div id="videoNo" class="no-media">请输入编码</div>
          </div>
        </div>

        <div style="margin-top:12px">
          <div class="title-row">
            <div><strong>打包图片</strong></div>
            <div class="muted" id="imgCount">—</div>
          </div>
          <div id="gallery" class="gallery" style="margin-top:10px"></div>
          <div id="imgNo" class="no-media" style="display:none;">正在查找图片…</div>
        </div>
      </section>

      <aside class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>信息</strong></div>
          <div class="muted">适配手机/PC</div>
        </div>
        <div style="margin-top:12px;color:var(--muted);font-size:14px">
          <p>本页面仅向第三方用户展示媒体内容。如需调整命名规则或路径，请联系维护者。</p>
          <p style="margin-top:8px;">⚠️ 视频与图片基于静态托管，首次加载可能较慢，浏览器可能会长时间缓存，如遇更新请刷新页面。</p>
        </div>
      </aside>
    </div>
  </main>

  <!-- 入口弹窗 -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>📦 请输入包裹编码</h3>
      <p>请输入被告知的编码以查看打包视频和图片。</p>
      <div class="row">
        <input id="entryInput" class="code-input" placeholder="请输入被告知的编码" />
        <button id="entryLoad" class="btn">加载</button>
      </div>
      <div class="actions">
        <button id="entryCancel" class="btn btn-cancel">关闭</button>
      </div>
      <p style="margin-top:12px;font-size:12px;color:#aaa;">按 <kbd>ESC</kbd> 或点击遮罩关闭</p>
    </div>
  </div>

  <!-- 错误弹窗 -->
  <div class="modal-overlay" id="errorModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>❌ 未找到媒体文件</h3>
      <p id="errorBody">未在当前目录找到该编码对应的视频或图片。</p>
      <div class="actions">
        <button id="errorRetry" class="btn"><i class="fas fa-redo-alt"></i> 重新输入</button>
        <button id="errorRefresh" class="btn btn-cancel"><i class="fas fa-sync-alt"></i> 刷新页面</button>
      </div>
      <p style="margin-top:12px;font-size:12px;color:#aaa;">按 <kbd>ESC</kbd> 关闭</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lb-close" id="lbClose">关闭 ✕</div>
    <div class="lb-nav lb-prev" id="lbPrev">‹</div>
    <img id="lbImage" src="" alt="预览" />
    <div class="lb-nav lb-next" id="lbNext">›</div>
  </div>

  <footer></footer>

  <script>
    (function(){
      // ---------- 配置 ----------
      const videoExts = ['mp4', 'webm', 'ogg'];
      // 仅保留最常见图片格式，大幅减少请求数量
      const imgExts = ['jpg', 'jpeg', 'png'];   // 不再包含 webp/gif

      function allCaseExts(list) {
        return list.flatMap(ext => [ext, ext.toUpperCase()]);
      }

      function videoCandidates(code) {
        return allCaseExts(videoExts).map(ext => `${code}.${ext}`);
      }

      function imageCandidates(code) {
        const arr = [];
        const allImgExts = allCaseExts(imgExts);
        // 1. 基础图片：编码.扩展名
        allImgExts.forEach(ext => arr.push(`${code}.${ext}`));
        // 2. 带序号的图片：编码_数字.扩展名  和  编码-数字.扩展名 （不再包含“编码+数字”无分隔符格式）
        for (let i = 1; i <= 6; i++) {
          allImgExts.forEach(ext => {
            arr.push(`${code}_${i}.${ext}`);
            arr.push(`${code}-${i}.${ext}`);
            // 注意：去掉了 `${code}${i}.${ext}` 这种混淆格式
          });
        }
        return arr;
      }

      // ---------- DOM ----------
      const entryModal = document.getElementById('entryModal');
      const entryInput = document.getElementById('entryInput');
      const entryLoad = document.getElementById('entryLoad');
      const entryCancel = document.getElementById('entryCancel');

      const errorModal = document.getElementById('errorModal');
      const errorBody = document.getElementById('errorBody');
      const errorRetry = document.getElementById('errorRetry');
      const errorRefresh = document.getElementById('errorRefresh');

      const codeTitle = document.getElementById('codeTitle');
      const videoBox = document.getElementById('videoBox');
      const videoNo = document.getElementById('videoNo');
      const gallery = document.getElementById('gallery');
      const imgNo = document.getElementById('imgNo');
      const imgCount = document.getElementById('imgCount');

      const lightbox = document.getElementById('lightbox');
      const lbImage = document.getElementById('lbImage');
      const lbClose = document.getElementById('lbClose');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      let galleryList = [], curIndex = 0;
      let currentLoadedCode = null;

      // Lightbox
      function openLightbox(i){
        if(!galleryList.length) return;
        curIndex = (i + galleryList.length) % galleryList.length;
        lbImage.src = galleryList[curIndex];
        lightbox.classList.add('show');
      }
      function closeLightbox(){ lightbox.classList.remove('show'); lbImage.src=''; }
      lbClose.addEventListener('click', closeLightbox);
      lbNext.addEventListener('click', ()=>openLightbox(curIndex+1));
      lbPrev.addEventListener('click', ()=>openLightbox(curIndex-1));
      lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{
        if(!lightbox.classList.contains('show')) return;
        if(e.key==='ArrowRight') lbNext.click();
        if(e.key==='ArrowLeft') lbPrev.click();
        if(e.key==='Escape') closeLightbox();
      });

      // --- 文件探测工具（视频用HEAD，图片用快速Image）---
      async function checkVideoExists(url) {
        try {
          const resp = await fetch(url, { method: 'HEAD' });
          if (resp.ok) return true;
        } catch (e) {}
        // 降级为video元素
        return new Promise(resolve => {
          const v = document.createElement('video');
          const timer = setTimeout(() => { resolve(false); }, 5000);
          v.onloadedmetadata = () => { clearTimeout(timer); resolve(true); };
          v.onerror = () => { clearTimeout(timer); resolve(false); };
          v.preload = 'metadata';
          v.src = url;
        });
      }

      function checkImageQuick(url) {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = url;
        });
      }

      // --- 并行预检函数 ---
      async function anyVideoExists(code) {
        const urls = videoCandidates(code).map(name => './' + name);
        const results = await Promise.allSettled(urls.map(url => checkVideoExists(url)));
        return results.some(r => r.status === 'fulfilled' && r.value === true);
      }

      async function anyImageExists(code) {
        const urls = imageCandidates(code).map(name => './' + name);
        const results = await Promise.allSettled(urls.map(url => checkImageQuick(url)));
        return results.some(r => r.status === 'fulfilled' && r.value === true);
      }

      async function anyMediaExists(code) {
        const [hasVideo, hasImage] = await Promise.all([
          anyVideoExists(code),
          anyImageExists(code)
        ]);
        return hasVideo || hasImage;
      }

      // --- 弹窗控制 ---
      function showEntryModal() { entryModal.classList.add('show'); entryInput.focus(); }
      function hideEntryModal() { entryModal.classList.remove('show'); }
      function showErrorModal(msg) {
        errorBody.textContent = msg || '未找到任何媒体文件，请检查编码是否正确。';
        errorModal.classList.add('show');
      }
      function hideErrorModal() { errorModal.classList.remove('show'); }

      entryModal.addEventListener('click', e => { if (e.target === entryModal) hideEntryModal(); });
      errorModal.addEventListener('click', e => { if (e.target === errorModal) hideErrorModal(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (entryModal.classList.contains('show')) hideEntryModal();
          if (errorModal.classList.contains('show')) hideErrorModal();
        }
      });

      // --- 加载媒体（视频顺序检测，图片并行）---
      async function loadMedia(code) {
        codeTitle.textContent = '编码：' + code;

        // 清空
        videoBox.querySelectorAll('video').forEach(v => v.remove());
        videoNo.style.display = 'block';
        videoNo.textContent = '正在加载…';
        gallery.innerHTML = '';
        imgNo.style.display = 'block';
        imgNo.textContent = '正在查找图片…';
        imgCount.textContent = '—';

        // 视频加载（候选少，顺序即可）
        let foundVideo = null;
        for (const name of videoCandidates(code)) {
          const url = './' + name;
          if (await checkVideoExists(url)) { foundVideo = url; break; }
        }

        if (foundVideo) {
          videoNo.style.display = 'none';
          const v = document.createElement('video');
          v.controls = true;
          v.playsInline = true;
          v.muted = true;
          v.src = foundVideo;
          videoBox.appendChild(v);
        } else {
          videoNo.textContent = '未找到视频资源';
        }

        // 图片加载：并行检测所有候选
        const imageUrls = imageCandidates(code).map(name => './' + name);
        const checks = await Promise.allSettled(imageUrls.map(url => checkImageQuick(url)));
        
        galleryList = [];
        const thumbElements = [];
        checks.forEach((result, idx) => {
          if (result.status === 'fulfilled' && result.value === true) {
            const url = imageUrls[idx];
            galleryList.push(url);
            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            const img = document.createElement('img');
            img.src = url;
            img.alt = code + ' - ' + (galleryList.length);
            img.loading = 'lazy';
            thumb.appendChild(img);
            thumb.addEventListener('click', () => openLightbox(galleryList.length - 1));
            thumbElements.push(thumb);
          }
        });

        if (galleryList.length > 0) {
          imgNo.style.display = 'none';
          gallery.append(...thumbElements);
          imgCount.textContent = galleryList.length + ' 张';
        } else {
          imgNo.style.display = 'block';
          imgNo.textContent = '未找到图片资源';
          imgCount.textContent = '0';
        }

        currentLoadedCode = code;
      }

      // --- 入口处理 ---
      async function handleCode(code) {
        if (!isValidCode(code)) {
          showEntryModal();
          return;
        }
        if (currentLoadedCode === code) return;

        hideEntryModal();
        hideErrorModal();
        videoNo.textContent = '验证中…';
        imgNo.textContent = '验证中…';
        imgNo.style.display = 'block';

        const exists = await anyMediaExists(code);
        if (!exists) {
          videoNo.textContent = '未找到媒体';
          imgNo.textContent = '未找到媒体';
          showErrorModal('未找到该编码对应的视频或图片，请确认编码是否正确。');
          return;
        }

        await loadMedia(code);
      }

      function hashToCode() {
        const h = location.hash ? location.hash.replace(/^#/, '') : '';
        return decodeURIComponent(h || '').trim();
      }

      function isValidCode(s) { return /^\d+$/.test(s); }

      // 事件绑定
      entryLoad.addEventListener('click', () => {
        const v = (entryInput.value || '').trim();
        if (!isValidCode(v)) { alert('请输入纯数字编码'); entryInput.focus(); return; }
        location.hash = encodeURIComponent(v);
        handleCode(v);
      });

      entryCancel.addEventListener('click', hideEntryModal);

      errorRetry.addEventListener('click', () => {
        hideErrorModal();
        showEntryModal();
      });

      errorRefresh.addEventListener('click', () => location.reload());

      window.addEventListener('hashchange', () => {
        const code = hashToCode();
        if (isValidCode(code)) handleCode(code);
      });

      // 启动
      (function start() {
        const code = hashToCode();
        if (code && isValidCode(code)) {
          handleCode(code);
        } else {
          videoNo.textContent = '请输入编码';
          imgNo.textContent = '请输入编码';
          imgNo.style.display = 'block';
          showEntryModal();
        }
      })();
    })();
  </script>
</body>
</html>
