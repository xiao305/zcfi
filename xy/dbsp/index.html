<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>包裹打包预览 • zcfi</title>

  <!-- Favicon（绝对路径，与首页一致） -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon/web-app-manifest-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon/web-app-manifest-512x512.png">

  <!-- CryptoJS MD5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">

  <style>
    :root{
      --primary:#4a6fa5;
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --radius:12px;
      --gap:16px;
    }
    html,body{height:100%;margin:0;font-family:"Noto Sans SC","Poppins",system-ui,Arial;background:var(--bg);color:#111}
    .site-header{
      background:linear-gradient(90deg,#fff 0%, #f3f7fb 100%);
      border-bottom:1px solid rgba(15,23,42,0.04);
      padding:14px 18px;display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:100;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary)}
    .brand img{width:40px;height:40px;border-radius:8px}
    .brand .sitename{font-size:14px;line-height:1}
    .brand .sitename small{display:block;color:var(--muted);font-size:12px}
    .container{max-width:1100px;margin:18px auto;padding:0 16px;padding-top:70px}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:var(--gap);align-items:start}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title-row h2{margin:0;font-size:16px;color:#111}
    .muted{color:var(--muted);font-size:13px}
    .video-box{background:#000;border-radius:10px;overflow:hidden;height:460px;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
    .thumb{border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #eef2f7;background:#f8fafc;height:96px;display:flex;align-items:center;justify-content:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .btn{background:var(--primary);color:white;border:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:background 0.2s}
    .btn:hover{background:#3a5a80}
    .no-media{padding:28px;text-align:center;color:var(--muted);display:block;}

    /* 输入框 */
    .code-input{
      padding:10px 12px;border-radius:10px;border:1px solid #e6eef8;background:white;width:140px;
      font-family:inherit;font-size:14px;
    }

    /* 居中弹窗通用 */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(3,7,18,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;
      animation:fadeIn 0.2s ease;
    }
    .modal-overlay.show{display:flex}
    .modal{
      background:var(--card);border-radius:12px;padding:24px;max-width:420px;width:100%;
      box-shadow:0 30px 60px rgba(2,6,23,0.4);
      animation:slideUp 0.25s ease;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

    .modal h3{margin:0 0 10px 0;font-size:18px;color:#222}
    .modal p{margin:0 0 16px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .modal .row{display:flex;gap:8px;align-items:center}
    .modal .code-input{flex:1;width:auto;}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .btn-cancel{background:#9aa8bf}
    .btn-cancel:hover{background:#7e8ba0}

    /* 加载动画 */
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .spinner{
      width:40px;height:40px;border:4px solid #e0e7ef;border-top:4px solid var(--primary);
      border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;
    }

    /* lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(3,7,18,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
    .lightbox.show{display:flex}
    .lightbox img{max-width:95%;max-height:95%;border-radius:8px}
    .lb-close{position:fixed;right:18px;top:18px;color:white;background:rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;cursor:pointer}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:white;font-size:32px;padding:8px 10px;cursor:pointer;user-select:none}
    .lb-prev{left:18px}
    .lb-next{right:18px}

    /* 页脚 */
    .page-footer{
      max-width:1100px;margin:18px auto;padding:12px 16px;color:var(--muted);font-size:12px;
      text-align:center;border-top:1px solid #eef2f7;
    }

    @media (max-width:1000px){ .layout{grid-template-columns:1fr} .video-box{height:280px} }
    @media (max-width:420px){ .video-box{height:220px} }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="/index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary)">
        <img src="/favicon/web-app-manifest-192x192.png" alt="zcfi logo" />
        <div class="sitename">zcfi<span style="color:var(--muted);font-weight:600">.</span><span style="color:var(--muted)">cn</span></div>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <section class="card">
        <div class="title-row">
          <h2 id="codeTitle">编码：—</h2>
        </div>

        <div id="videoArea" style="margin-top:12px">
          <div class="video-box" id="videoBox">
            <div id="videoNo" class="no-media">请输入编码</div>
          </div>
        </div>

        <div style="margin-top:12px">
          <div class="title-row">
            <div><strong>打包图片</strong></div>
            <div class="muted" id="imgCount">—</div>
          </div>
          <div id="gallery" class="gallery" style="margin-top:10px"></div>
          <div id="imgNo" class="no-media" style="display:none;">正在查找图片…</div>
        </div>
      </section>

      <aside class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>信息</strong></div>
          <div class="muted">适配手机/PC</div>
        </div>
        <div style="margin-top:12px;color:var(--muted);font-size:14px">
          <p>本页面仅向第三方用户展示媒体内容。如需调整命名规则或路径，请联系维护者。</p>
          <p style="margin-top:8px;">⚠️ 视频与图片基于静态托管，首次加载可能较慢，浏览器可能长时间缓存。如视频显示损坏或长时间未加载，请<strong>刷新页面</strong>重试。</p>
        </div>
      </aside>
    </div>
  </main>

  <!-- 页脚声明 -->
  <footer class="page-footer">
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;">
      <span>© 2026 zcfi.cn</span>
      <span>|</span>
      <span>本页面内容由第三方上传，仅供预览</span>
      <span>|</span>
      <span>如有疑问请联系站点维护者</span>
    </div>
  </footer>

  <!-- 入口弹窗：无编码时输入 -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>📦 请输入包裹编码</h3>
      <p>请输入被告知的编码以查看打包视频和图片。</p>
      <div class="row">
        <input id="entryInput" class="code-input" placeholder="请输入被告知的编码" />
        <button id="entryLoad" class="btn">加载</button>
      </div>
      <div class="actions">
        <button id="entryCancel" class="btn btn-cancel">关闭</button>
      </div>
      <p style="margin-top:12px;font-size:12px;color:#aaa;">按 <kbd>ESC</kbd> 或点击遮罩关闭</p>
    </div>
  </div>

  <!-- 核验弹窗（动态内容） -->
  <div class="modal-overlay" id="verifyModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div id="verifyContent"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lb-close" id="lbClose">关闭 ✕</div>
    <div class="lb-nav lb-prev" id="lbPrev">‹</div>
    <img id="lbImage" src="" alt="预览" />
    <div class="lb-nav lb-next" id="lbNext">›</div>
  </div>

  <script>
    (function(){
      // ---------- 配置 ----------
      const videoExts = ['mp4', 'webm', 'ogg'];
      const imgExts = ['jpg', 'jpeg', 'png'];

      function allCaseExts(list) {
        return list.flatMap(ext => [ext, ext.toUpperCase()]);
      }

      // 路径均相对于当前 HTML 文件所在目录
      function videoCandidates(code) {
        return allCaseExts(videoExts).map(ext => `./videos/${code}.${ext}`);
      }

      function imageCandidates(code) {
        const arr = [];
        const allImgExts = allCaseExts(imgExts);
        allImgExts.forEach(ext => arr.push(`./images/${code}.${ext}`));
        for (let i = 1; i <= 6; i++) {
          allImgExts.forEach(ext => {
            arr.push(`./images/${code}_${i}.${ext}`);
            arr.push(`./images/${code}-${i}.${ext}`);
          });
        }
        return arr;
      }

      // ---------- DOM ----------
      const entryModal = document.getElementById('entryModal');
      const entryInput = document.getElementById('entryInput');
      const entryLoad = document.getElementById('entryLoad');
      const entryCancel = document.getElementById('entryCancel');

      const verifyModal = document.getElementById('verifyModal');
      const verifyContent = document.getElementById('verifyContent');

      const codeTitle = document.getElementById('codeTitle');
      const videoBox = document.getElementById('videoBox');
      const videoNo = document.getElementById('videoNo');
      const gallery = document.getElementById('gallery');
      const imgNo = document.getElementById('imgNo');
      const imgCount = document.getElementById('imgCount');

      const lightbox = document.getElementById('lightbox');
      const lbImage = document.getElementById('lbImage');
      const lbClose = document.getElementById('lbClose');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      let galleryList = [], curIndex = 0;
      let currentLoadedCode = null;
      let loadAbort = false;
      let handling = false;

      // Lightbox 交互
      function openLightbox(i){
        if(!galleryList.length) return;
        curIndex = (i + galleryList.length) % galleryList.length;
        lbImage.src = galleryList[curIndex];
        lightbox.classList.add('show');
      }
      function closeLightbox(){ lightbox.classList.remove('show'); lbImage.src=''; }
      lbClose.addEventListener('click', closeLightbox);
      lbNext.addEventListener('click', ()=>openLightbox(curIndex+1));
      lbPrev.addEventListener('click', ()=>openLightbox(curIndex-1));
      lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{
        if(!lightbox.classList.contains('show')) return;
        if(e.key==='ArrowRight') lbNext.click();
        if(e.key==='ArrowLeft') lbPrev.click();
        if(e.key==='Escape') closeLightbox();
      });

      // --- 文件存在性检测 ---
      function checkVideoExists(url) {
        return new Promise(resolve => {
          fetch(url, { method: 'HEAD' })
            .then(resp => {
              if (resp.ok) return resolve(true);
              throw new Error('HEAD failed');
            })
            .catch(() => {
              const v = document.createElement('video');
              const timer = setTimeout(() => { resolve(false); }, 4000);
              v.onloadedmetadata = () => { clearTimeout(timer); resolve(true); };
              v.onerror = () => { clearTimeout(timer); resolve(false); };
              v.preload = 'metadata';
              v.src = url;
            });
        });
      }

      function checkImageExists(url) {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = url;
        });
      }

      // ---------- 核验弹窗逻辑 ----------
      function showVerifyModal() { verifyModal.classList.add('show'); }
      function hideVerifyModal() { verifyModal.classList.remove('show'); }

      function renderVerifyLoading(code) {
        verifyContent.innerHTML = `
          <h3 style="text-align:center;">🔍 正在核验编码 ${code}</h3>
          <div class="spinner"></div>
          <p style="text-align:center;color:var(--muted);">请稍候，系统正在验证资源…</p>
          <div style="text-align:center;margin-top:12px;">
            <button id="verifyCancelBtn" class="btn btn-cancel" style="font-size:12px;">取消</button>
          </div>
        `;
        document.getElementById('verifyCancelBtn').addEventListener('click', () => {
          loadAbort = true;
          hideVerifyModal();
        });
      }

      function renderKeyInput(code, onSubmit) {
        verifyContent.innerHTML = `
          <h3 style="text-align:center;">🔐 该编码需要原始密钥</h3>
          <p style="text-align:center;">请输入原始密钥以继续查看。</p>
          <div class="row">
            <input id="keyInput" class="code-input" type="text" placeholder="请输入原始密钥" autocomplete="off" />
            <button id="keySubmit" class="btn">验证</button>
          </div>
          <div style="text-align:center;margin-top:12px;">
            <button id="keyCancel" class="btn btn-cancel" style="font-size:12px;">取消</button>
          </div>
          <p id="keyError" style="color:#c33;font-size:13px;margin-top:8px;display:none;"></p>
        `;
        const keyInput = document.getElementById('keyInput');
        const keySubmit = document.getElementById('keySubmit');
        const keyCancel = document.getElementById('keyCancel');
        const keyError = document.getElementById('keyError');

        const trySubmit = () => {
          const raw = keyInput.value.trim();
          if (!raw) {
            keyError.style.display = 'block';
            keyError.textContent = '请输入密钥';
            return;
          }
          onSubmit(raw);
        };
        keySubmit.addEventListener('click', trySubmit);
        keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });
        keyCancel.addEventListener('click', () => hideVerifyModal());
      }

      function renderError(msg, showRetry = true) {
        verifyContent.innerHTML = `
          <h3 style="text-align:center;color:#c62828;">❌ 核验失败</h3>
          <p style="text-align:center;">${msg}</p>
          <div class="actions" style="justify-content:center;margin-top:16px;">
            ${showRetry ? '<button id="verifyRetry" class="btn"><i class="fas fa-redo-alt"></i> 重新输入</button>' : ''}
            <button id="verifyRefresh" class="btn btn-cancel"><i class="fas fa-sync-alt"></i> 刷新页面</button>
          </div>
        `;
        if (showRetry) {
          document.getElementById('verifyRetry').addEventListener('click', () => {
            hideVerifyModal();
            showEntryModal();
          });
        }
        document.getElementById('verifyRefresh').addEventListener('click', () => location.reload());
      }

      // 核心验证函数
      async function performVerification(code, rawInput) {
        showVerifyModal();
        renderVerifyLoading(code);

        // 使用相对路径请求 hashes 文件
        const hashUrl = `./hashes/${code}.txt?t=${Date.now()}`;
        let resp;
        try {
          resp = await fetch(hashUrl);
        } catch (e) {
          renderError('无效编码，请检查链接', false);
          return false;
        }

        if (resp.status === 404) {
          renderError('无效编码，请检查链接', false);
          return false;
        }

        if (!resp.ok) {
          renderError('核验服务暂时不可用，请稍后重试', false);
          return false;
        }

        const storedHash = (await resp.text()).trim();

        if (rawInput !== undefined && rawInput !== null && rawInput !== '') {
          const inputHash = CryptoJS.MD5(rawInput).toString();
          if (inputHash === storedHash) {
            hideVerifyModal();
            return true;
          } else {
            renderError('密钥错误，请重新输入', true);
            return false;
          }
        } else {
          return new Promise(resolve => {
            renderKeyInput(code, (raw) => {
              const inputHash = CryptoJS.MD5(raw).toString();
              if (inputHash === storedHash) {
                hideVerifyModal();
                resolve(true);
              } else {
                const keyError = document.getElementById('keyError');
                if (keyError) {
                  keyError.style.display = 'block';
                  keyError.textContent = '密钥错误，请重新输入';
                }
              }
            });
          });
        }
      }

      // ---------- 媒体加载（相对路径） ----------
      async function loadMedia(code) {
        loadAbort = true;
        await new Promise(r => setTimeout(r, 30));
        loadAbort = false;
        currentLoadedCode = code;

        codeTitle.textContent = '编码：' + code;

        videoBox.querySelectorAll('video').forEach(v => v.remove());
        videoNo.style.display = 'block';
        videoNo.textContent = '正在查找视频…';
        gallery.innerHTML = '';
        galleryList = [];
        imgNo.style.display = 'block';
        imgNo.textContent = '正在查找图片…';
        imgCount.textContent = '—';

        let videoFound = false;
        let imageFound = false;

        const videoPromise = (async () => {
          const videoUrls = videoCandidates(code);
          for (const url of videoUrls) {
            if (loadAbort) return;
            const exists = await checkVideoExists(url);
            if (exists && !loadAbort) {
              videoNo.style.display = 'none';
              const v = document.createElement('video');
              v.controls = true;
              v.playsInline = true;
              v.muted = true;
              v.src = url;
              videoBox.appendChild(v);
              videoFound = true;
              break;
            }
          }
          if (!videoFound && !loadAbort) {
            videoNo.textContent = '未找到视频资源';
          }
        })();

        const imagePromise = (async () => {
          const imageUrls = imageCandidates(code);
          const foundUrls = [];
          for (const url of imageUrls) {
            if (loadAbort) return;
            const exists = await checkImageExists(url);
            if (exists && !loadAbort) {
              foundUrls.push(url);
              const thumb = document.createElement('div');
              thumb.className = 'thumb';
              const img = document.createElement('img');
              img.src = url;
              img.alt = code + ' - ' + foundUrls.length;
              img.loading = 'lazy';
              thumb.appendChild(img);
              const currentIndex = galleryList.length;
              thumb.addEventListener('click', () => openLightbox(currentIndex));
              gallery.appendChild(thumb);
              galleryList.push(url);
              imageFound = true;
              imgCount.textContent = galleryList.length + ' 张';
              if (galleryList.length === 1) {
                imgNo.style.display = 'none';
              }
            }
          }
          if (!imageFound && !loadAbort) {
            imgNo.style.display = 'block';
            imgNo.textContent = '未找到图片资源';
            imgCount.textContent = '0';
          }
        })();

        await Promise.all([videoPromise, imagePromise]);
      }

      // ---------- 入口处理 ----------
      function showEntryModal() { entryModal.classList.add('show'); entryInput.focus(); }
      function hideEntryModal() { entryModal.classList.remove('show'); }

      function parseHash() {
        const h = location.hash ? location.hash.replace(/^#/, '') : '';
        const decoded = decodeURIComponent(h || '').trim();
        if (!decoded) return { code: null, raw: null };
        const eqIndex = decoded.indexOf('=');
        if (eqIndex === -1) return { code: decoded, raw: null };
        const code = decoded.substring(0, eqIndex);
        const raw = decoded.substring(eqIndex + 1);
        return { code, raw };
      }

      function isValidCode(s) { return /^\d+$/.test(s); }

      async function handleCode(code, raw) {
        if (!isValidCode(code)) {
          showEntryModal();
          return;
        }
        if (handling || currentLoadedCode === code) return;
        handling = true;

        const verified = await performVerification(code, raw);
        if (!verified) {
          handling = false;
          return;
        }

        await loadMedia(code);
        handling = false;
      }

      // 事件绑定
      entryLoad.addEventListener('click', () => {
        const v = (entryInput.value || '').trim();
        if (!isValidCode(v)) { alert('请输入纯数字编码'); entryInput.focus(); return; }
        hideEntryModal();
        handleCode(v, null);
      });

      entryCancel.addEventListener('click', hideEntryModal);

      entryModal.addEventListener('click', e => { if (e.target === entryModal) hideEntryModal(); });
      verifyModal.addEventListener('click', e => { if (e.target === verifyModal) hideVerifyModal(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (entryModal.classList.contains('show')) hideEntryModal();
          if (verifyModal.classList.contains('show')) hideVerifyModal();
        }
      });

      window.addEventListener('hashchange', () => {
        const { code, raw } = parseHash();
        if (code && isValidCode(code)) handleCode(code, raw);
      });

      // 启动
      (function start() {
        const { code, raw } = parseHash();
        if (code && isValidCode(code)) {
          handleCode(code, raw);
        } else {
          videoNo.textContent = '请输入编码';
          imgNo.textContent = '请输入编码';
          imgNo.style.display = 'block';
          showEntryModal();
        }
      })();
    })();
  </script>
</body>
