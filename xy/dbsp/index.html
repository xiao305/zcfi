<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon/web-app-manifest-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon/web-app-manifest-512x512.png">

  <!-- 微信分享卡片兜底 meta 标签（动态更新由 JS 控制） -->
  <meta property="og:title" id="ogTitle" content="包裹打包预览 • zcfi" />
  <meta property="og:description" content="安全、便捷的包裹内容预览工具，支持视频与图片在线查看。" />

  <meta property="og:image" content="https://你的域名/favicon/web-app-manifest-192x192.png" />
  <meta property="og:url" id="ogUrl" content="" />
  <meta property="og:type" content="website" />
  <meta itemprop="name" content="包裹打包预览 • zcfi" />
  <meta itemprop="description" content="安全、便捷的包裹内容预览工具，支持视频与图片在线查看。" />
  <meta itemprop="image" content="https://你的域名/favicon/web-app-manifest-192x192.png" />

  <!-- CryptoJS MD5 -->

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/components.css">

  <style>
    :root{
      --primary:#4a6fa5;
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --radius:12px;
      --gap:16px;
    }
    html,body{height:100%;margin:0;font-family:"Noto Sans SC","Poppins",system-ui,Arial;background:var(--bg);color:#111}
    .site-header{
      background:linear-gradient(90deg,#fff 0%, #f3f7fb 100%);
      border-bottom:1px solid rgba(15,23,42,0.04);
      padding:14px 18px;display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:100;
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary)}
    .brand img{width:40px;height:40px;border-radius:8px}
    .brand .sitename{font-size:14px;line-height:1}
    .brand .sitename small{display:block;color:var(--muted);font-size:12px}
    .container{max-width:1100px;margin:18px auto;padding:0 16px;padding-top:70px}
    .layout{display:grid;grid-template-columns:1fr 360px;gap:var(--gap);align-items:start}
    .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title-row h2{margin:0;font-size:16px;color:#111}
    .muted{color:var(--muted);font-size:13px}
    .video-box{background:#000;border-radius:10px;overflow:hidden;height:460px;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
    .thumb{border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #eef2f7;background:#f8fafc;height:96px;display:flex;align-items:center;justify-content:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .btn{background:var(--primary);color:white;border:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:background 0.2s}
    .btn:hover{background:#3a5a80}
    .no-media{padding:28px;text-align:center;color:var(--muted);display:block;}

    .code-input{
      padding:10px 12px;border-radius:10px;border:1px solid #e6eef8;background:white;width:140px;
      font-family:inherit;font-size:14px;
    }

    .modal-overlay{
      position:fixed;inset:0;background:rgba(3,7,18,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;
      animation:fadeIn 0.2s ease;
    }
    .modal-overlay.show{display:flex}
    .modal{
      background:var(--card);border-radius:12px;padding:24px;max-width:420px;width:100%;
      box-shadow:0 30px 60px rgba(2,6,23,0.4);
      animation:slideUp 0.25s ease;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

    .modal h3{margin:0 0 10px 0;font-size:18px;color:#222}
    .modal p{margin:0 0 16px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .modal .row{display:flex;gap:8px;align-items:center}
    .modal .code-input{flex:1;width:auto;}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .btn-cancel{background:#9aa8bf}
    .btn-cancel:hover{background:#7e8ba0}

    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .spinner{
      width:40px;height:40px;border:4px solid #e0e7ef;border-top:4px solid var(--primary);
      border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;
    }

    .lightbox{position:fixed;inset:0;background:rgba(3,7,18,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
    .lightbox.show{display:flex}
    .lightbox img{max-width:95%;max-height:95%;border-radius:8px}
    .lb-close{position:fixed;right:18px;top:18px;color:white;background:rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;cursor:pointer}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:white;font-size:32px;padding:8px 10px;cursor:pointer;user-select:none}
    .lb-prev{left:18px}
    .lb-next{right:18px}

    .page-footer{
      max-width:1100px;margin:18px auto;padding:12px 16px;color:var(--muted);font-size:12px;
      text-align:center;border-top:1px solid #eef2f7;
    }

    .status-bar{
      position:fixed;top:60px;left:0;right:0;z-index:90;
      background:rgba(74,111,165,0.95);color:white;padding:8px 16px;
      font-size:13px;text-align:center;display:none;
      box-shadow:0 2px 8px rgba(0,0,0,0.15);
      backdrop-filter: blur(6px);
      display:flex;align-items:center;justify-content:center;
    }
    .status-bar.show{display:flex;}
    .status-close{
      margin-left:12px;background:none;border:none;color:white;
      font-size:16px;cursor:pointer;opacity:0.9;
    }

    .small-note{font-size:12px;color:#aaa;text-align:center;margin-top:8px;}

    @media (max-width:1000px){ .layout{grid-template-columns:1fr} .video-box{height:280px} }
    @media (max-width:420px){ .video-box{height:220px} }
  </style>
</head>

  <div class="modal-overlay" id="entryModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>请输入包裹编码</h3>
      <p>请输入被告知的编码以查看打包视频和图片。</p>

  <div class="modal-overlay" id="verifyModal">

  <div class="lightbox" id="lightbox">
    <div class="lb-close" id="lbClose">关闭 ✕</div>
    <div class="lb-nav lb-prev" id="lbPrev">‹</div>
    <img id="lbImage" src="" alt="预览" />
    <div class="lb-nav lb-next" id="lbNext">›</div>

  <script>
    (function(){
      // ---------- 配置 ----------
      const videoExts = ['mp4', 'webm', 'ogg'];
      const imgExts = ['jpg', 'jpeg', 'png'];
      const BASE_DOMAIN = 'https://你的域名'; // 修改为实际域名

      function allCaseExts(list) { return list.flatMap(ext => [ext, ext.toUpperCase()]); }
      function videoCandidates(code) { return allCaseExts(videoExts).map(ext => `./videos/${code}.${ext}`); }
      function imageCandidates(code) {
        const arr = [];
        const all = allCaseExts(imgExts);
        all.forEach(ext => arr.push(`./images/${code}.${ext}`));
        for (let i = 1; i <= 6; i++) {
          all.forEach(ext => {
            arr.push(`./images/${code}_${i}.${ext}`);
            arr.push(`./images/${code}-${i}.${ext}`);
          });
        }
        return arr;
      }

      // ---------- DOM ----------
      const entryModal = document.getElementById('entryModal');
      const entryInput = document.getElementById('entryInput');
      const entryLoad = document.getElementById('entryLoad');
      const entryCancel = document.getElementById('entryCancel');

      const verifyModal = document.getElementById('verifyModal');
      const verifyContent = document.getElementById('verifyContent');
      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');
      const statusClose = document.getElementById('statusClose');

      const codeTitle = document.getElementById('codeTitle');
      const videoBox = document.getElementById('videoBox');
      const videoNo = document.getElementById('videoNo');
      const gallery = document.getElementById('gallery');
      const imgNo = document.getElementById('imgNo');
      const imgCount = document.getElementById('imgCount');

      const lightbox = document.getElementById('lightbox');
      const lbImage = document.getElementById('lbImage');
      const lbClose = document.getElementById('lbClose');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      let galleryList = [], curIndex = 0;
      let currentLoadedCode = null;
      let loadAbort = false;
      let handling = false;
      let skipHashChange = false;

      // ---------- 动态标题与分享 ----------
      function getCurrentCodeFromURL() {
        const hash = location.hash ? location.hash.replace(/^#/, '') : '';
        const params = new URLSearchParams(hash.includes('=') ? '' : location.search);
        // 优先从 hash 中的编码（例如 #272）或 #272=xxx 中的编码部分提取
        if (hash) {
          const eqIndex = hash.indexOf('=');
          return eqIndex === -1 ? hash : hash.substring(0, eqIndex);
        }
        return params.get('code') || null;
      }

      function updatePageTitle() {
        const code = getCurrentCodeFromURL();
        const title = code ? `编码：${code}` : '编码：未定义';
        document.title = title + ' • zcfi';
        document.getElementById('dynamicTitle').textContent = document.title;
        // 同步 og:title
        const ogTitle = document.getElementById('ogTitle');
        if (ogTitle) ogTitle.setAttribute('content', document.title);
      }

      // 安全链接：剔除敏感参数
      function getSafeShareURL() {
        const url = new URL(location.href);
        const sensitiveKeys = ['key', 'token', 'secret'];
        const params = new URLSearchParams(url.search);
        // 移除敏感参数（忽略大小写）
        for (const [key] of params) {
          if (sensitiveKeys.some(k => k.toLowerCase() === key.toLowerCase())) {
            params.delete(key);
          }
        }
        // 保留 hash
        const safeSearch = params.toString();
        const newSearch = safeSearch ? '?' + safeSearch : '';
        // 如果没有任何查询参数，且没有 hash，则返回根路径（根据要求）
        if (!newSearch && !url.hash) {
          return BASE_DOMAIN + '/';
        }
        return BASE_DOMAIN + url.pathname + newSearch + url.hash;
      }

      function updateShareMeta() {
        const safeURL = getSafeShareURL();
        document.getElementById('ogUrl').setAttribute('content', safeURL);
        // 同时更新 og:title 已在 updatePageTitle 中处理
      }

      // 尝试使用微信 JS-SDK 设置分享（需要后端签名支持）
      function configWXShare() {
        if (typeof wx === 'undefined') return;
        // 这里需要后端提供签名，请根据实际情况替换
        // wx.config({ debug: false, appId: '', timestamp: , nonceStr: '', signature: '', jsApiList: ['updateAppMessageShareData','updateTimelineShareData'] });
        // wx.ready(function() {
        //   const shareData = {
        //     title: document.title,
        //     desc: '安全、便捷的包裹内容预览工具，支持视频与图片在线查看。',
        //     link: getSafeShareURL(),
        //     imgUrl: BASE_DOMAIN + '/favicon/web-app-manifest-192x192.png'
        //   };
        //   wx.updateAppMessageShareData(shareData);
        //   wx.updateTimelineShareData(shareData);
        // });
      }

      // ---------- 工具函数 ----------
      function openLightbox(i){
        if(!galleryList.length) return;
        curIndex = (i + galleryList.length) % galleryList.length;
        lbImage.src = galleryList[curIndex];
        lightbox.classList.add('show');
      }
      function closeLightbox(){ lightbox.classList.remove('show'); lbImage.src=''; }
      lbClose.addEventListener('click', closeLightbox);
      lbNext.addEventListener('click', ()=>openLightbox(curIndex+1));
      lbPrev.addEventListener('click', ()=>openLightbox(curIndex-1));
      lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{
        if(!lightbox.classList.contains('show')) return;
        if(e.key==='ArrowRight') lbNext.click();
        if(e.key==='ArrowLeft') lbPrev.click();
        if(e.key==='Escape') closeLightbox();
      });

      // 文件检测函数，强制禁用缓存（解决 vivo 浏览器缓存问题）
      function checkFileExists(url) {
        return new Promise(resolve => {
          const cacheBust = url.includes('?') ? '&_=' + Date.now() : '?_=' + Date.now();
          const finalUrl = url + cacheBust;
          fetch(finalUrl, { method: 'HEAD', cache: 'no-store' })
            .then(resp => {
              if(resp.ok) return resolve(true);
              if(url.match(/\.(mp4|webm|ogg)$/i)) {
                const v = document.createElement('video');
                const t = setTimeout(() => resolve(false), 3000);
                v.onloadedmetadata = () => { clearTimeout(t); resolve(true); };
                v.onerror = () => { clearTimeout(t); resolve(false); };
                v.preload = 'metadata';
                v.src = finalUrl;
              } else {
                resolve(false);
              }
            })
            .catch(() => {
              if(url.match(/\.(mp4|webm|ogg)$/i)) {
                const v = document.createElement('video');
                const t = setTimeout(() => resolve(false), 3000);
                v.onloadedmetadata = () => { clearTimeout(t); resolve(true); };
                v.onerror = () => { clearTimeout(t); resolve(false); };
                v.preload = 'metadata';
                v.src = finalUrl;
              } else {
                resolve(false);
              }
            });
        });
      }

      function showEntryModal() { entryModal.classList.add('show'); entryInput.focus(); }
      function hideEntryModal() { entryModal.classList.remove('show'); }
      function showVerifyModal() { verifyModal.classList.add('show'); }
      function hideVerifyModal() { verifyModal.classList.remove('show'); }

      entryModal.addEventListener('click', e => { if(e.target === entryModal) hideEntryModal(); });
      verifyModal.addEventListener('click', e => { if(e.target === verifyModal) hideVerifyModal(); });
      document.addEventListener('keydown', e => {
        if(e.key === 'Escape') {
          if(entryModal.classList.contains('show')) hideEntryModal();
          if(verifyModal.classList.contains('show')) hideVerifyModal();
        }
      });

      function showStatusBar(text) {
        if (!text) return;
        statusText.textContent = text;
        statusBar.classList.add('show');
        statusClose.onclick = () => statusBar.classList.remove('show');
      }

      // ---------- 密钥验证（1秒后开始核验） ----------
      function verifyCode(code, initialRaw) {
        return new Promise(async (resolve) => {
          verifyContent.innerHTML = `
            <h3 style="text-align:center;">正在核验编码…</h3>
            <div class="spinner"></div>
            <p style="text-align:center;color:var(--muted);">请稍候，系统正在核验编码…</p>
          `;
          showVerifyModal();

          await new Promise(r => setTimeout(r, 1000));

          const hashUrl = `./hashes/${code}.txt?t=${Date.now()}`;
          let resp;
          try { resp = await fetch(hashUrl, { cache: 'no-store' }); } catch(e) {
            verifyContent.innerHTML = `<h3 style="text-align:center;color:#c62828;">编码不存在</h3><p style="text-align:center;">请检查编码是否正确，或尝试刷新页面。</p><div style="text-align:center;margin-top:16px;"><button id="closeInvalidBtn" class="btn btn-cancel">关闭</button></div>`;
            document.getElementById('closeInvalidBtn').addEventListener('click', () => { hideVerifyModal(); resolve(false); });
            return;
          }
          if(resp.status === 404) {
            verifyContent.innerHTML = `<h3 style="text-align:center;color:#c62828;">编码不存在</h3><p style="text-align:center;">请检查编码是否正确，或尝试刷新页面。</p><div style="text-align:center;margin-top:16px;"><button id="closeInvalidBtn" class="btn btn-cancel">关闭</button></div>`;
            document.getElementById('closeInvalidBtn').addEventListener('click', () => { hideVerifyModal(); resolve(false); });
            return;
          }
          if(!resp.ok) {
            verifyContent.innerHTML = `<h3 style="text-align:center;color:#c62828;">服务不可用</h3><p style="text-align:center;">核验服务暂时不可用，请稍后重试。</p><div style="text-align:center;margin-top:16px;"><button id="closeFailBtn" class="btn btn-cancel">关闭</button></div>`;
            document.getElementById('closeFailBtn').addEventListener('click', () => { hideVerifyModal(); resolve(false); });
            return;
          }

          const storedHash = (await resp.text()).trim();

          const tryVerify = (raw) => {
            if(!raw) return false;
            return CryptoJS.MD5(raw).toString() === storedHash;
          };

          if(initialRaw) {
            verifyContent.innerHTML = `
              <h3 style="text-align:center;">正在核验密钥…</h3>
              <div class="spinner"></div>
              <p style="text-align:center;color:var(--muted);">请稍候，系统正在验证密钥…</p>
            `;
            await new Promise(r => setTimeout(r, 1000));
            const success = tryVerify(initialRaw);
            if(success) {
              hideVerifyModal();
              resolve(initialRaw);
            } else {
              showInputForm('密钥不正确，请重新输入');
            }
            return;
          }

          showInputForm();

          function showInputForm(errorMsg) {
            verifyContent.innerHTML = `
              <h3 style="text-align:center;">需要密钥</h3>
              <p style="text-align:center;">该编码已加密，请输入密钥以继续查看。</p>
              <div class="row">
                <input id="keyInput" class="code-input" type="text" placeholder="请输入密钥" autocomplete="off" />
                <button id="keySubmit" class="btn">验证</button>
              </div>
              <div style="text-align:center;margin-top:12px;">
                <button id="keyCancel" class="btn btn-cancel">取消</button>
              </div>
              <p id="keyError" style="color:#c33;font-size:13px;margin-top:8px;${errorMsg ? '' : 'display:none;'}">${errorMsg || ''}</p>
            `;
            const keyInput = document.getElementById('keyInput');
            const keySubmit = document.getElementById('keySubmit');
            const keyCancelBtn = document.getElementById('keyCancel');
            const keyError = document.getElementById('keyError');

            const submitHandler = () => {
              const raw = keyInput.value.trim();
              if(!raw) {
                keyError.style.display = 'block';
                keyError.textContent = '请输入密钥';
                return;
              }

              verifyContent.innerHTML = `
                <h3 style="text-align:center;">正在核验密钥…</h3>
                <div class="spinner"></div>
                <p style="text-align:center;color:var(--muted);">请稍候，系统正在验证密钥…</p>
              `;
              setTimeout(() => {
                if(tryVerify(raw)) {
                  hideVerifyModal();
                  resolve(raw);
                } else {
                  showInputForm('密钥错误，请重新输入');
                }
              }, 1000);
            };

            keySubmit.addEventListener('click', submitHandler);
            keyInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitHandler(); });
            keyCancelBtn.addEventListener('click', () => {
              hideVerifyModal();
              resolve(false);
            });
          }
        });
      }

      // ---------- 批量扫描与加载 ----------
      async function scanAndLoadMedia(code) {
        loadAbort = true;
        await new Promise(r => setTimeout(r, 30));
        loadAbort = false;
        currentLoadedCode = code;

        codeTitle.textContent = '编码：' + code;
        videoBox.querySelectorAll('video').forEach(v => v.remove());
        videoNo.style.display = 'block';
        videoNo.textContent = '正在扫描资源…';
        gallery.innerHTML = '';
        galleryList = [];
        imgNo.style.display = 'block';
        imgNo.textContent = '正在扫描资源…';
        imgCount.textContent = '—';

        verifyContent.innerHTML = `
          <div style="text-align:center;margin-bottom:8px;">
            <span style="background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:500;">密钥核验成功</span>
          </div>
          <h3 style="text-align:center;">正在查找资源</h3>
          <div class="spinner"></div>
          <p style="text-align:center;color:var(--muted);">正在扫描视频与图片文件…</p>
        `;
        showVerifyModal();

        const videoUrls = videoCandidates(code);
        const imageUrls = imageCandidates(code);
        const allUrls = [...videoUrls, ...imageUrls];

        const results = await Promise.allSettled(allUrls.map(url => checkFileExists(url)));
        const existingUrls = new Set();
        results.forEach((res, idx) => {
          if(res.status === 'fulfilled' && res.value === true) {
            existingUrls.add(allUrls[idx]);
          }
        });

        const existingVideos = videoUrls.filter(url => existingUrls.has(url));
        const existingImages = imageUrls.filter(url => existingUrls.has(url));

        if(existingVideos.length > 0) {
          videoNo.style.display = 'none';
          const v = document.createElement('video');
          v.controls = true; v.playsInline = true; v.muted = true;
          v.src = existingVideos[0];
          videoBox.appendChild(v);
        } else {
          videoNo.textContent = '未找到视频资源';
        }

        if(existingImages.length > 0) {
          imgNo.style.display = 'none';
          existingImages.forEach((src, idx) => {
            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            const img = document.createElement('img');
            img.src = src; img.alt = code; img.loading = 'lazy';
            thumb.appendChild(img);
            const lightboxIdx = galleryList.length;
            thumb.addEventListener('click', () => openLightbox(lightboxIdx));
            gallery.appendChild(thumb);
            galleryList.push(src);
          });
          imgCount.textContent = galleryList.length + ' 张';
        } else {
          imgNo.style.display = 'block';
          imgNo.textContent = '未找到图片资源';
          imgCount.textContent = '0';
        }

        const stats = {
          videoCount: existingVideos.length,
          imageCount: existingImages.length
        };

        if(stats.videoCount === 0 && stats.imageCount === 0) {
          verifyContent.innerHTML = `
            <h3 style="text-align:center;color:#c62828;">未找到资源</h3>
            <p style="text-align:center;">可能原因：文件尚未上传、系统正在更新、页面加载卡顿。</p>
            <p style="text-align:center;">建议稍后重新查询。</p>
            <div class="actions" style="justify-content:center;">
              <button id="retryNoResBtn" class="btn">重新查询</button>
              <button id="closeNoResBtn" class="btn btn-cancel">关闭</button>
            </div>
          `;
          document.getElementById('retryNoResBtn').addEventListener('click', () => {
            hideVerifyModal();
            currentLoadedCode = null;
            handleCode(code, null);
          });
          document.getElementById('closeNoResBtn').addEventListener('click', hideVerifyModal);
          return;
        }

        verifyContent.innerHTML = `
          <div style="text-align:center;margin-bottom:8px;">
            <span style="background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:500;">密钥核验成功</span>
          </div>
          <h3 style="text-align:center;color:#2e7d32;">资源查找完成</h3>
          <p style="text-align:center;">共找到 <strong>${stats.videoCount}</strong> 个视频，<strong>${stats.imageCount}</strong> 张图片。</p>
          <p style="text-align:center;font-size:13px;color:var(--muted);">文件首次加载可能较慢，请耐心等待，加载完成后可正常播放。</p>
          <p style="text-align:center;font-size:13px;color:var(--muted);">弹窗将在 <span id="autoCloseTimer">30</span> 秒后自动关闭</p>
          <div style="text-align:center;margin-top:12px;">
            <button id="closeScanNow" class="btn">立即查看</button>
          </div>
        `;
        let sec = 30;
        const timerSpan = document.getElementById('autoCloseTimer');
        const countdown = setInterval(() => {
          sec--;
          if(sec <= 0) {
            clearInterval(countdown);
            hideVerifyModal();
          } else {
            timerSpan.textContent = sec;
          }
        }, 1000);
        document.getElementById('closeScanNow').addEventListener('click', () => {
          clearInterval(countdown);
          hideVerifyModal();
        });
      }

      function parseHash() {
        const h = location.hash ? location.hash.replace(/^#/, '') : '';
        const decoded = decodeURIComponent(h || '').trim();
        if(!decoded) return { code: null, raw: null };
        const eqIndex = decoded.indexOf('=');
        if(eqIndex === -1) return { code: decoded, raw: null };
        return { code: decoded.substring(0, eqIndex), raw: decoded.substring(eqIndex + 1) };
      }

      function isValidCode(s) { return /^\d+$/.test(s); }

      async function handleCode(code, raw) {
        if(!isValidCode(code)) { showEntryModal(); return; }
        if(handling || currentLoadedCode === code) return;
        handling = true;

        const rawKey = await verifyCode(code, raw);
        if(!rawKey) { handling = false; return; }

        if(rawKey !== raw) {
          skipHashChange = true;
          location.hash = `#${code}=${encodeURIComponent(rawKey)}`;
        }

        await scanAndLoadMedia(code);
        handling = false;
      }

      // ---------- 事件绑定 ----------
      entryLoad.addEventListener('click', () => {
        const v = (entryInput.value || '').trim();
        if(!isValidCode(v)) { alert('请输入纯数字编码'); entryInput.focus(); return; }
        hideEntryModal();
        handleCode(v, null);
      });
      entryCancel.addEventListener('click', hideEntryModal);

      window.addEventListener('hashchange', () => {
        if(skipHashChange) {
          skipHashChange = false;
          return;
        }
        const { code, raw } = parseHash();
        if(code && isValidCode(code)) handleCode(code, raw);
        updatePageTitle();
        updateShareMeta();
        configWXShare();
      });

      // ---------- 初始化 ----------
      function init() {
        updatePageTitle();
        updateShareMeta();
        configWXShare();
        const { code, raw } = parseHash();
        if(code && isValidCode(code)) {
          handleCode(code, raw);
        } else {
          videoNo.textContent = '请输入编码';
          imgNo.textContent = '请输入编码';
          imgNo.style.display = 'block';
          showEntryModal();
        }
      }

      init();
    })();
  </script>
</body>
</html>
